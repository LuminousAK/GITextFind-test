<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GI Text Search Demo</title>
    <style>
        :root {
            --bg: #f4efe6;
            --panel: rgba(255, 252, 247, 0.94);
            --line: rgba(62, 45, 31, 0.16);
            --text: #2f241b;
            --text-secondary: #746253;
            --muted: #746253;
            --accent: #b44d1e;
            --accent-rgb: 180, 77, 30;
            --accent-soft: rgba(180, 77, 30, 0.12);
            --shadow: 0 24px 60px rgba(77, 51, 31, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(221, 136, 75, 0.26), transparent 28%),
                radial-gradient(circle at right 20%, rgba(179, 88, 29, 0.14), transparent 24%),
                linear-gradient(180deg, #f8f3eb 0%, var(--bg) 100%);
        }

        .shell {
            width: min(980px, calc(100vw - 32px));
            margin: 40px auto;
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: var(--panel);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 2.8rem;
            line-height: 1.05;
            letter-spacing: 0;
        }

        .lead {
            margin: 0 0 22px;
            color: var(--muted);
            line-height: 1.6;
        }

        .searchbar {
            display: grid;
            grid-template-columns: minmax(160px, 220px) minmax(0, 1fr) auto;
            gap: 12px;
            margin-bottom: 18px;
        }

        input[type="search"],
        select {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid var(--line);
            border-radius: 16px;
            font: inherit;
            font-size: 1rem;
            color: var(--text);
            background: rgba(255, 255, 255, 0.78);
            outline: none;
        }

        button {
            padding: 0 18px;
            border: 0;
            border-radius: 16px;
            font: inherit;
            font-weight: 700;
            color: #fff8f2;
            background: linear-gradient(135deg, #c85b28 0%, #98401b 100%);
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.48;
            cursor: not-allowed;
        }

        .status {
            min-height: 28px;
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .meta-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .tip {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.58);
        }

        .results {
            display: grid;
            gap: 14px;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pagination-top {
            margin-bottom: 20px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--line);
        }

        .pagination-bottom {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .pagination[hidden] {
            display: none;
        }

        .pagination button {
            min-height: 42px;
            padding: 8px 14px;
            border-radius: 12px;
        }

        .pagination-form {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .pagination-input {
            width: 84px;
            min-height: 42px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.78);
            font: inherit;
            text-align: center;
            outline: none;
        }

        .pagination-total {
            min-width: 64px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .result {
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.72);
        }

        .result-kind {
            display: inline-flex;
            margin-bottom: 10px;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 0.8rem;
            color: #7a4526;
            background: rgba(180, 77, 30, 0.12);
        }

        .result h2 {
            margin: 0 0 8px;
            font-size: 1.05rem;
            line-height: 1.4;
        }

        .result a {
            color: var(--accent);
            text-decoration: none;
        }

        .result-source {
            margin: 10px 0 8px;
            font-size: 0.92rem;
            color: var(--muted);
        }

        .origin-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 30px;
            padding: 0;
            border: 0;
            border-radius: 0;
            color: var(--muted);
            background: transparent;
            font: inherit;
            font-weight: 600;
            cursor: default;
        }

        .origin-action.is-clickable {
            color: var(--accent);
            cursor: pointer;
        }

        .origin-action.is-clickable:hover {
            text-decoration: underline;
        }

        .origin-arrow {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .origin-action.is-clickable:hover .origin-arrow {
            transform: translateX(4px);
        }

        .result-path,
        .result-hash {
            margin: 4px 0;
            font-size: 0.9rem;
            color: var(--muted);
            word-break: break-all;
        }

        .excerpt-group {
            margin-top: 12px;
            display: grid;
            gap: 10px;
        }

        .excerpt-block {
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(244, 239, 230, 0.8);
        }

        .excerpt-label {
            margin: 0 0 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #7a4526;
        }

        .excerpt {
            margin: 0;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .excerpt p {
            margin: 0;
        }

        .excerpt p + p {
            margin-top: 6px;
        }

        .placeholder {
            padding: 22px;
            border: 1px dashed var(--line);
            border-radius: 18px;
            color: var(--muted);
            background: rgba(255, 250, 244, 0.72);
            line-height: 1.7;
        }

        code {
            padding: 0.1em 0.4em;
            border-radius: 0.4em;
            background: rgba(47, 36, 27, 0.08);
        }

        .drawer-backdrop {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            justify-items: end;
            background: rgba(47, 36, 27, 0.28);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .drawer-backdrop.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        .context-drawer {
            width: min(560px, calc(100vw - 28px));
            height: 100vh;
            padding: 22px;
            overflow: auto;
            border-left: 1px solid var(--line);
            background: #fffaf4;
            box-shadow: -24px 0 60px rgba(77, 51, 31, 0.2);
            transform: translateX(100%);
            transition: transform 0.24s ease;
        }

        .drawer-backdrop.is-open .context-drawer {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .drawer-title {
            margin: 0 0 6px;
            font-size: 1.3rem;
            line-height: 1.3;
        }

        .drawer-subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.5;
            word-break: break-all;
        }

        .drawer-close {
            display: inline-grid;
            place-items: center;
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.78);
            font-size: 1.4rem;
            line-height: 1;
        }

        .context-empty {
            padding: 18px;
            border: 1px dashed var(--line);
            border-radius: 16px;
            color: var(--muted);
            background: rgba(244, 239, 230, 0.72);
            line-height: 1.7;
        }

        .context-table {
            border: 1px solid var(--line);
            border-radius: 16px;
            overflow: auto;
            background: rgba(255, 255, 255, 0.72);
        }

        .context-row {
            display: grid;
            grid-template-columns: 96px repeat(var(--context-lang-count, 2), minmax(0, 1fr));
            min-width: calc(96px + var(--context-lang-count, 2) * 220px);
            gap: 1px;
            background: var(--line);
        }

        .context-row + .context-row {
            border-top: 1px solid var(--line);
        }

        .context-row.is-header {
            font-weight: 600;
            background: var(--line);
        }

        .context-cell {
            min-width: 0;
            padding: 8px 12px;
            background: var(--bg);
            color: var(--text);
            word-break: normal;
            overflow-wrap: break-word;
            line-height: 1.6;
        }

        .context-row.is-header .context-cell {
            color: #7a4526;
            font-size: 0.86rem;
            font-weight: 700;
            background: rgba(180, 77, 30, 0.08);
        }

        .context-cell-speaker {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .context-row.context-hit .context-cell {
            background: rgba(var(--accent-rgb), 0.08);
        }

        .keyword-highlight {
            background: rgba(255, 213, 79, 0.45);
            color: inherit;
            border-radius: 2px;
            padding: 0 1px;
        }

        .context-cell p {
            margin: 0;
        }

        .context-cell p + p {
            margin-top: 4px;
        }

        @media (max-width: 700px) {
            .shell {
                margin: 18px auto;
                padding: 20px;
            }

            h1 {
                font-size: 2.2rem;
            }

            .searchbar {
                grid-template-columns: 1fr;
            }

            .pagination {
                flex-wrap: wrap;
            }

            .pagination button {
                flex: 1 1 auto;
            }

            .pagination-form {
                order: 3;
                width: 100%;
                justify-content: center;
            }

            .drawer-backdrop {
                align-items: end;
                justify-items: stretch;
            }

            .context-drawer {
                width: 100%;
                height: min(82vh, 680px);
                border-top: 1px solid var(--line);
                border-left: 0;
                border-radius: 20px 20px 0 0;
                box-shadow: 0 -24px 60px rgba(77, 51, 31, 0.2);
                transform: translateY(100%);
            }

            .drawer-backdrop.is-open .context-drawer {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <h1>GI Text Search Demo</h1>
        <p class="lead">
            选择可用语言索引进行检索，命中后加载对应文本桶。
        </p>

        <form class="searchbar" id="search-form">
            <select id="language-select" aria-label="Search language"></select>
            <input
                id="search-input"
                type="search"
                placeholder="输入中文或 English 查询"
                autocomplete="off"
                spellcheck="false"
            >
            <button type="submit">Search</button>
        </form>

        <div class="meta-bar">
            <span class="tip">Data source: <code>runtime-config.json → R2 manifests</code></span>
            <span class="tip">Index: <code>languages/&lt;language&gt;/releases/&lt;version&gt;/pagefind/</code></span>
            <span class="tip">Text: <code>languages/&lt;language&gt;/releases/&lt;version&gt;/text-data/</code></span>
        </div>

        <div id="status" class="status">Initializing Pagefind...</div>
        <nav class="pagination pagination-top" data-pagination aria-label="顶部搜索结果分页" hidden>
            <button type="button" data-page-action="first">首页</button>
            <button type="button" data-page-action="previous">上一页</button>
            <form class="pagination-form" data-pagination-form>
                <input
                    class="pagination-input"
                    data-pagination-input
                    type="number"
                    min="1"
                    step="1"
                    inputmode="numeric"
                    aria-label="页码"
                >
                <span class="pagination-total" data-pagination-total>/ 1</span>
                <button type="submit" data-pagination-go>跳转</button>
            </form>
            <button type="button" data-page-action="next">下一页</button>
            <button type="button" data-page-action="last">末页</button>
        </nav>
        <section id="results" class="results" aria-live="polite"></section>
        <nav class="pagination pagination-bottom" data-pagination aria-label="底部搜索结果分页" hidden>
            <button type="button" data-page-action="first">首页</button>
            <button type="button" data-page-action="previous">上一页</button>
            <form class="pagination-form" data-pagination-form>
                <input
                    class="pagination-input"
                    data-pagination-input
                    type="number"
                    min="1"
                    step="1"
                    inputmode="numeric"
                    aria-label="页码"
                >
                <span class="pagination-total" data-pagination-total>/ 1</span>
                <button type="submit" data-pagination-go>跳转</button>
            </form>
            <button type="button" data-page-action="next">下一页</button>
            <button type="button" data-page-action="last">末页</button>
        </nav>
    </main>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden>
        <aside id="context-drawer" class="context-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
            <div class="drawer-header">
                <div>
                    <h2 id="drawer-title" class="drawer-title">详细上下文</h2>
                    <p id="drawer-subtitle" class="drawer-subtitle">等待选择结果来源。</p>
                </div>
                <button id="drawer-close" class="drawer-close" type="button" aria-label="关闭上下文">×</button>
            </div>
            <div id="drawer-content"></div>
        </aside>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
